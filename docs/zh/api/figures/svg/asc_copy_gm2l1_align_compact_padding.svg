<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">Compact padding layout</title>
  <desc id="desc">Three contiguous 48-byte data bursts followed by one 16-byte padding region. The destination stride is 48 bytes.</desc>
  <style>
    .title { font: 20px 'FZLanTingHeiS', 'Huawei Sans', sans-serif; fill: #000000; }
    .label { font: 16px 'FZLanTingHeiS', 'Huawei Sans', sans-serif; fill: #000000; }
    .small { font: 14px 'FZLanTingHeiS', 'Huawei Sans', sans-serif; fill: #000000; }
    .data { fill: #C2D5FE; stroke: #686D75; stroke-width: 0.75; }
    .pad { fill: #FEE2BA; stroke: #686D75; stroke-width: 0.75; }
    .line { stroke: #686D75; stroke-width: 0.75; }
  </style>
  <rect width="840" height="250" fill="#FFFFFF"/>
  <text x="40" y="35" class="title">Compact padding (3 x 48B, stride = 48B)</text>
  <text x="40" y="78" class="label">L1 Buffer</text>
  <rect x="60" y="105" width="180" height="60" class="data"/>
  <rect x="240" y="105" width="180" height="60" class="data"/>
  <rect x="420" y="105" width="180" height="60" class="data"/>
  <rect x="600" y="105" width="60" height="60" class="pad"/>
  <text x="100" y="143" class="label">Data 48B</text>
  <text x="280" y="143" class="label">Data 48B</text>
  <text x="460" y="143" class="label">Data 48B</text>
  <text x="609" y="143" class="small">Pad 16B</text>
  <text x="60" y="192" class="small">0B</text>
  <text x="240" y="192" class="small">48B</text>
  <text x="420" y="192" class="small">96B</text>
  <text x="600" y="192" class="small">144B</text>
  <line x1="60" y1="214" x2="240" y2="214" class="line"/>
  <line x1="60" y1="208" x2="60" y2="220" class="line"/>
  <line x1="240" y1="208" x2="240" y2="220" class="line"/>
  <text x="98" y="238" class="small">stride = 48B</text>
</svg>
