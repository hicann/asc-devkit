<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">Normal padding layout</title>
  <desc id="desc">Three 48-byte data bursts each followed by 16 bytes of padding. The destination stride is 64 bytes.</desc>
  <style>
    .title { font: 20px 'FZLanTingHeiS', 'Huawei Sans', sans-serif; fill: #000000; }
    .label { font: 16px 'FZLanTingHeiS', 'Huawei Sans', sans-serif; fill: #000000; }
    .small { font: 14px 'FZLanTingHeiS', 'Huawei Sans', sans-serif; fill: #000000; }
    .data { fill: #C2D5FE; stroke: #686D75; stroke-width: 0.75; }
    .pad { fill: #FEE2BA; stroke: #686D75; stroke-width: 0.75; }
    .line { stroke: #686D75; stroke-width: 0.75; }
  </style>
  <rect width="840" height="250" fill="#FFFFFF"/>
  <text x="40" y="35" class="title">Normal padding (3 x 48B, stride = 64B)</text>
  <text x="40" y="78" class="label">L1 Buffer</text>
  <rect x="60" y="105" width="180" height="60" class="data"/>
  <rect x="240" y="105" width="60" height="60" class="pad"/>
  <rect x="300" y="105" width="180" height="60" class="data"/>
  <rect x="480" y="105" width="60" height="60" class="pad"/>
  <rect x="540" y="105" width="180" height="60" class="data"/>
  <rect x="720" y="105" width="60" height="60" class="pad"/>
  <text x="100" y="143" class="label">Data 48B</text>
  <text x="249" y="143" class="small">Pad 16B</text>
  <text x="340" y="143" class="label">Data 48B</text>
  <text x="489" y="143" class="small">Pad 16B</text>
  <text x="580" y="143" class="label">Data 48B</text>
  <text x="729" y="143" class="small">Pad 16B</text>
  <text x="60" y="192" class="small">0B</text>
  <text x="300" y="192" class="small">64B</text>
  <text x="540" y="192" class="small">128B</text>
  <line x1="60" y1="214" x2="300" y2="214" class="line"/>
  <line x1="60" y1="208" x2="60" y2="220" class="line"/>
  <line x1="300" y1="208" x2="300" y2="220" class="line"/>
  <text x="98" y="238" class="small">stride = 64B</text>
</svg>
